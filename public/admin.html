<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVPicks - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #00d9ff;
            font-size: 28px;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #00d9ff;
            font-size: 32px;
            font-weight: bold;
        }

        .tables-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .table-btn {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .table-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }

        .data-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .data-section.active {
            display: block;
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .data-header h2 {
            color: #00d9ff;
        }

        .btn {
            background: #00d9ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        table th {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
            font-weight: bold;
        }

        table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .pagination button:hover {
            background: rgba(0, 217, 255, 0.2);
        }

        .pagination button.active {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00d9ff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
        }

        .login-container h2 {
            color: #00d9ff;
            margin-bottom: 30px;
            text-align: center;
        }

        .error {
            background: #dc3545;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #28a745;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00d9ff;
        }

        .query-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .query-section textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: 'Courier New', monospace;
            margin-bottom: 15px;
        }

        .actions-cell {
            display: flex;
            gap: 5px;
        }

        .actions-cell button {
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <h2>🏈 Admin Panel</h2>
        <div id="loginError" class="error"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Iniciar Sesión</button>
        </form>
    </div>

    <div id="adminPanel" style="display: none;">
        <div class="container">
            <div class="header">
                <h1>🏈 MVPicks - Admin Panel</h1>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>

            <div id="errorMsg" class="error"></div>
            <div id="successMsg" class="success"></div>

            <div class="stats-grid" id="statsGrid">
                <!-- Se llenará dinámicamente -->
            </div>

            <div class="query-section">
                <h2 style="color: #00d9ff; margin-bottom: 15px;">Consulta SQL (Solo SELECT)</h2>
                <textarea id="sqlQuery" placeholder="SELECT * FROM ..."></textarea>
                <button class="btn" onclick="executeQuery()">Ejecutar Consulta</button>
                <div id="queryResults" style="margin-top: 20px;"></div>
            </div>

            <div class="tables-section">
                <h2 style="color: #00d9ff; margin-bottom: 15px;">Tablas de la Base de Datos</h2>
                <div class="tables-grid" id="tablesGrid">
                    <!-- Se llenará dinámicamente -->
                </div>
            </div>

            <div class="data-section" id="dataSection">
                <div class="data-header">
                    <h2 id="tableTitle"></h2>
                    <div>
                        <button class="btn btn-secondary" onclick="closeTable()">← Volver</button>
                        <button class="btn" onclick="openCreateModal()">+ Crear Registro</button>
                    </div>
                </div>
                <div id="tableData">
                    <!-- Se llenará dinámicamente -->
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <!-- Modal para crear/editar registros -->
    <div id="recordModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="color: #00d9ff; margin-bottom: 20px;"></h2>
            <form id="recordForm">
                <div id="formFields"></div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex: 1;">Guardar</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5001';
        let token = localStorage.getItem('adminToken');
        let currentTable = '';
        let currentPage = 1;
        let tableSchema = {};

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.token) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadDashboard();
                } else {
                    showError('loginError', data.message || 'Error al iniciar sesión');
                }
            } catch (error) {
                showError('loginError', 'Error de conexión: ' + error.message);
            }
        });

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        async function loadDashboard() {
            await Promise.all([loadStats(), loadTables()]);
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 403) {
                    showError('errorMsg', 'No tienes permisos de administrador');
                    setTimeout(logout, 2000);
                    return;
                }

                const data = await response.json();
                const statsHtml = Object.entries(data.totalRecords).map(([key, value]) => `
                    <div class="stat-card">
                        <h3>${formatTableName(key)}</h3>
                        <div class="number">${value}</div>
                    </div>
                `).join('');

                document.getElementById('statsGrid').innerHTML = statsHtml;
            } catch (error) {
                showError('errorMsg', 'Error al cargar estadísticas');
            }
        }

        async function loadTables() {
            try {
                const response = await fetch(`${API_URL}/admin/tables`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                const tablesHtml = Object.entries(data.tables).map(([key, value]) => `
                    <button class="table-btn" onclick="loadTableData('${key}', '${value.name}')">
                        ${value.name}
                    </button>
                `).join('');

                document.getElementById('tablesGrid').innerHTML = tablesHtml;
            } catch (error) {
                showError('errorMsg', 'Error al cargar tablas');
            }
        }

        async function loadTableData(table, tableName, page = 1) {
            currentTable = table;
            currentPage = page;
            document.getElementById('tableTitle').textContent = tableName;

            try {
                // Cargar esquema de la tabla
                const schemaResponse = await fetch(`${API_URL}/admin/tables/${table}/schema`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const schemaData = await schemaResponse.json();
                tableSchema = schemaData.schema;

                // Cargar datos de la tabla
                const response = await fetch(`${API_URL}/admin/tables/${table}?page=${page}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                // Crear tabla HTML
                const columns = Object.keys(data.data[0] || {});
                const tableHtml = `
                    <table>
                        <thead>
                            <tr>
                                ${columns.map(col => `<th>${col}</th>`).join('')}
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.data.map(row => `
                                <tr>
                                    ${columns.map(col => `<td>${formatValue(row[col])}</td>`).join('')}
                                    <td class="actions-cell">
                                        <button class="btn" onclick="openEditModal(${row.id})">Editar</button>
                                        <button class="btn btn-danger" onclick="deleteRecord(${row.id})">Eliminar</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                document.getElementById('tableData').innerHTML = tableHtml;

                // Crear paginación
                const paginationHtml = Array.from({ length: data.totalPages }, (_, i) => `
                    <button class="${i + 1 === page ? 'active' : ''}" onclick="loadTableData('${table}', '${tableName}', ${i + 1})">
                        ${i + 1}
                    </button>
                `).join('');

                document.getElementById('pagination').innerHTML = paginationHtml;
                document.getElementById('dataSection').classList.add('active');
            } catch (error) {
                showError('errorMsg', 'Error al cargar datos de la tabla');
            }
        }

        function closeTable() {
            document.getElementById('dataSection').classList.remove('active');
        }

        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Crear Registro';
            const formHtml = tableSchema.map(field => {
                if (field.autoIncrement || field.field === 'createdAt' || field.field === 'updatedAt') {
                    return '';
                }
                return `
                    <div class="form-group">
                        <label>${field.field}${field.allowNull === false ? ' *' : ''}:</label>
                        <input type="text" name="${field.field}" ${field.allowNull === false ? 'required' : ''}>
                    </div>
                `;
            }).join('');

            document.getElementById('formFields').innerHTML = formHtml;
            document.getElementById('recordModal').classList.add('active');

            document.getElementById('recordForm').onsubmit = async (e) => {
                e.preventDefault();
                await createRecord(new FormData(e.target));
            };
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_URL}/admin/tables/${currentTable}/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                const record = data.record;

                document.getElementById('modalTitle').textContent = 'Editar Registro';
                const formHtml = tableSchema.map(field => {
                    if (field.autoIncrement || field.field === 'createdAt' || field.field === 'updatedAt') {
                        return '';
                    }
                    return `
                        <div class="form-group">
                            <label>${field.field}${field.allowNull === false ? ' *' : ''}:</label>
                            <input type="text" name="${field.field}" value="${record[field.field] || ''}" ${field.allowNull === false ? 'required' : ''}>
                        </div>
                    `;
                }).join('');

                document.getElementById('formFields').innerHTML = formHtml;
                document.getElementById('recordModal').classList.add('active');

                document.getElementById('recordForm').onsubmit = async (e) => {
                    e.preventDefault();
                    await updateRecord(id, new FormData(e.target));
                };
            } catch (error) {
                showError('errorMsg', 'Error al cargar registro');
            }
        }

        function closeModal() {
            document.getElementById('recordModal').classList.remove('active');
        }

        async function createRecord(formData) {
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch(`${API_URL}/admin/tables/${currentTable}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('successMsg', 'Registro creado exitosamente');
                    closeModal();
                    loadTableData(currentTable, document.getElementById('tableTitle').textContent, currentPage);
                } else {
                    showError('errorMsg', result.message || 'Error al crear registro');
                }
            } catch (error) {
                showError('errorMsg', 'Error de conexión');
            }
        }

        async function updateRecord(id, formData) {
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch(`${API_URL}/admin/tables/${currentTable}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('successMsg', 'Registro actualizado exitosamente');
                    closeModal();
                    loadTableData(currentTable, document.getElementById('tableTitle').textContent, currentPage);
                } else {
                    showError('errorMsg', result.message || 'Error al actualizar registro');
                }
            } catch (error) {
                showError('errorMsg', 'Error de conexión');
            }
        }

        async function deleteRecord(id) {
            if (!confirm('¿Estás seguro de eliminar este registro?')) return;

            try {
                const response = await fetch(`${API_URL}/admin/tables/${currentTable}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('successMsg', 'Registro eliminado exitosamente');
                    loadTableData(currentTable, document.getElementById('tableTitle').textContent, currentPage);
                } else {
                    showError('errorMsg', result.message || 'Error al eliminar registro');
                }
            } catch (error) {
                showError('errorMsg', 'Error de conexión');
            }
        }

        async function executeQuery() {
            const query = document.getElementById('sqlQuery').value;

            if (!query.trim()) {
                showError('errorMsg', 'Escribe una consulta SQL');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();

                if (response.ok && data.results) {
                    const columns = Object.keys(data.results[0] || {});
                    const html = `
                        <p style="color: #00d9ff; margin-bottom: 10px;">${data.count} resultados</p>
                        <table>
                            <thead>
                                <tr>
                                    ${columns.map(col => `<th>${col}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${data.results.map(row => `
                                    <tr>
                                        ${columns.map(col => `<td>${formatValue(row[col])}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('queryResults').innerHTML = html;
                } else {
                    showError('errorMsg', data.message || 'Error al ejecutar consulta');
                }
            } catch (error) {
                showError('errorMsg', 'Error de conexión');
            }
        }

        function formatValue(value) {
            if (value === null || value === undefined) return '<em style="color: #888;">null</em>';
            if (typeof value === 'boolean') return value ? '✓' : '✗';
            if (typeof value === 'string' && value.length > 100) return value.substring(0, 100) + '...';
            return value;
        }

        function formatTableName(name) {
            const names = {
                users: 'Usuarios',
                leagues: 'Ligas',
                leagueMembers: 'Miembros de Liga',
                games: 'Partidos',
                picks: 'Picks',
                scores: 'Puntuaciones',
                invitationTokens: 'Tokens de Invitación',
                adminPicks: 'Picks de Admin'
            };
            return names[name] || name;
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => element.style.display = 'none', 5000);
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => element.style.display = 'none', 3000);
        }

        // Auto-login si hay token
        if (token) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadDashboard();
        }
    </script>
</body>
</html>
